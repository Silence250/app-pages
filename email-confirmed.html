<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登録完了 / Registration complete</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 0; background: #f5f7fa; color: #1a1a1a; }
  main { max-width: 420px; margin: 0 auto; padding: 64px 24px; text-align: center; }
  .icon { font-size: 64px; color: #2e9e5b; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { line-height: 1.7; margin: 8px 0; }
  hr { border: 0; border-top: 1px solid #d8dde3; margin: 32px 0; }
</style>
</head>
<body>
<main>
  <div class="icon">&#10003;</div>
  <h1>登録が完了しました</h1>
  <p>メールアドレスの確認ができました。<br>アプリに戻って、ログインしてください。</p>
  <hr>
  <h1>Registration complete</h1>
  <p>Your email address has been confirmed.<br>Please return to the app and log in.</p>
</main>
</body>
</html>
